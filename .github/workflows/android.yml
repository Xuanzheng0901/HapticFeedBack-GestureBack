name: Android CI

on:
  push:
    tags:
      - '**'
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 1. 必须赋予写入权限，工作流才能创建 Release 并上传附件
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decrypt Keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "SIGNING_KEY is empty, skipping decryption."
          else
            echo "SIGNING_KEY found. Decrypting keystore..."
            echo -n "$SIGNING_KEY" | base64 -d > ${{ github.workspace }}/keystore.jks
          fi

      - name: Build with Gradle
        run: |
          if [ -f "${{ github.workspace }}/keystore.jks" ]; then
            echo "Keystore found. Building Debug and Release..."
            ./gradlew assembleDebug assembleRelease
          else
            echo "Keystore NOT found. Building Debug only..."
            ./gradlew assembleDebug
          fi
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 2. 依然保留：将 Debug APK 传到 Actions 产物中（方便平时开发测试直接下载）
      - name: Upload Debug APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: HapticFeedBack-Debug
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 9

      # 3. 新增：仅在推送 Git 标签（Tag）时，自动创建 GitHub Release 并上传 Release APK
      - name: Create GitHub Release and Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true # 自动根据提交历史生成 Release 说明日志