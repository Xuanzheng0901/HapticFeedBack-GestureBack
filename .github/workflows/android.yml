name: Android CI

on:
  push:
    tags:
      - '**'
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decrypt Keystore
        if: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY != '' }}
        run: |
          echo -n "${{ secrets.SIGNING_KEY }}" | base64 -d > ${{ github.workspace }}/keystore.jks

      - name: Build with Gradle
        run: |
          if [ -f "${{ github.workspace }}/keystore.jks" ]; then
            echo "Keystore found. Building Debug and Release..."
            ./gradlew assembleDebug assembleRelease
          else
            echo "Keystore NOT found. Building Debug only..."
            ./gradlew assembleDebug
          fi
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HapticFeedBack-Release
          path: app/build/outputs/apk/release/*.apk
          compression-level: 9
          if-no-files-found: ignore # 确保在 PR 阶段因无 Release 包而不会导致 Workflow 报错

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HapticFeedBack-Debug
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 9